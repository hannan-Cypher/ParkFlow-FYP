version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: valet_parking_db_prod
    environment:
      POSTGRES_USER: Owner
      POSTGRES_PASSWORD: 1512147296110@Hm
      POSTGRES_DB: valet_parking
    ports:
      - "5432:5432" # Ensure local mapping if you need to connect from outside, else 5432 is fine
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./components/database/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./migrations/008_capacity_enforcement.sql:/docker-entrypoint-initdb.d/01_008_capacity.sql
      - ./migrations/009_supervisor_shift_tracking.sql:/docker-entrypoint-initdb.d/02_009_supervisor.sql
      - ./migrations/011_vip_zone_support.sql:/docker-entrypoint-initdb.d/03_011_vip.sql
      - ./migrations/012_anpr_logs.sql:/docker-entrypoint-initdb.d/04_012_anpr.sql
      - ./migrations/013_realtime_sse_triggers.sql:/docker-entrypoint-initdb.d/05_013_sse.sql
      - ./migrations/006_seed_data_clean.sql:/docker-entrypoint-initdb.d/06_init_data.sql
    networks:
      - parkflow-network-prod
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U Owner -d valet_parking" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkflow_app_prod
    network_mode: host
    environment:
      - NODE_ENV=production
      # Use localhost:5432 because host networking bypasses Docker DNS
      - DATABASE_URL=postgresql://Owner:1512147296110@Hm@localhost:5432/valet_parking
      - NEXTAUTH_URL=https://parkflow.freedynamicdns.net
      - NEXT_PUBLIC_APP_URL=https://parkflow.freedynamicdns.net
      # Flask AI service (Mac via Tailscale — reachable directly via host network)
      - FLASK_AI_URL=http://100.85.240.92:8080
      - CAMERA_STREAM_URL=http://100.85.240.92:8081/video_feed
      - CLOUD_URL=https://parkflow.freedynamicdns.net
      - ANPR_WEBHOOK_SECRET=parkflow-anpr-secret-2024
      # - NEXTAUTH_SECRET= # Pass via .env
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      - postgres
    restart: unless-stopped

# ai-service removed - runs on edge device (Mac)

networks:
  parkflow-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
